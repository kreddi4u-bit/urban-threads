<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Urban Threads</title>
  <meta name="description" content="Log in or create an Urban Threads account.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e0e0e'/%3E%3Cpath d='M16 18h10v20a6 6 0 0 0 12 0V18h10v20a16 16 0 0 1-32 0z' fill='%23d7ff3a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main class="page page--center">
    <div class="auth">
      <h1 class="auth__title">Your account</h1>

      <div class="tabs" role="tablist" aria-label="Log in or sign up">
        <button type="button" class="tabs__btn is-active" role="tab" data-tab="login" aria-selected="true">Log in</button>
        <button type="button" class="tabs__btn" role="tab" data-tab="signup" aria-selected="false">Sign up</button>
      </div>

      <!-- Log in -->
      <form class="form" id="loginForm" novalidate>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="form__message" role="alert"></p>
        <button type="submit" class="btn btn--wide">Log in</button>
      </form>
      <p class="form_forgot">
        <a href="#" id="forgotPassword">Forgot Password?</a>
      </p>

      <!-- Sign up -->
      <form class="form" id="signupForm" novalidate hidden>
        <label class="field">
          <span>Name</span>
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" autocomplete="new-password" minlength="6" required>
          <small>At least 6 characters</small>
        </label>
        <p class="form__message" role="alert"></p>
        <button type="submit" class="btn btn--wide">Create account</button>
      </form>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
