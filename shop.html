<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Urban Threads</title>
  <meta name="description" content="Browse hoodies, t-shirts, sneakers and accessories from Urban Threads.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e0e0e'/%3E%3Cpath d='M16 18h10v20a6 6 0 0 0 12 0V18h10v20a16 16 0 0 1-32 0z' fill='%23d7ff3a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main class="page">
    <div class="container">
      <h1 class="page__title">Shop</h1>

      <!-- Filters -->
      <div class="toolbar">
        <div class="chips" id="categoryChips" role="group" aria-label="Filter by category"></div>

        <div class="toolbar__controls">
          <label class="field field--inline">
            <span class="visually-hidden">Search products</span>
            <input type="search" id="searchInput" placeholder="Search products" autocomplete="off">
          </label>
          <label class="field field--inline">
            <span class="visually-hidden">Sort products</span>
            <select id="sortSelect">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name">Name: A to Z</option>
            </select>
          </label>
        </div>
      </div>

      <p class="result-count" id="resultCount" aria-live="polite"></p>
      <div class="message message--center" id="shopMessage" aria-live="polite"></div>

      <!-- Products (loaded from Firestore) -->
      <div class="grid" id="productGrid"></div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="../js/shop.js"></script>
</body>
</html>
